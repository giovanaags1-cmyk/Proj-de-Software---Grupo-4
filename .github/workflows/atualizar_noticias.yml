
name: Atualizar notícias DEMOS

on:
  schedule:
    - cron: '17 12 * * *'
      timezone: "America/Sao_Paulo"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-noticias:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Buscar notícias pela API
        working-directory: ./DEMOS
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: python scripts/preparar_noticias.py

      - name: Salvar notícias atualizadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEMOS/dados/noticias.json

          if ! git diff --cached --quiet; then
            git commit -m "Atualiza notícias do DEMOS"
            git push
          fi
