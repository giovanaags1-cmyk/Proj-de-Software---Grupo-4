<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contato - Demos</title>

  <link rel="stylesheet" href="./css/demos.css">
  <link rel="stylesheet" href="./css/contato.css">
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >
</head>
<body>

  <header class="cabecalho">

    <div class="cabecalho-esquerda">

      <a href="favoritos.html" class="icone-menu" aria-label="Favoritos">
        <i class="fa-solid fa-bookmark"></i>
      </a>

      <a href="index.html" class="icone-menu" aria-label="Página inicial">
        <i class="fa-solid fa-house"></i>
      </a>

    </div>

    <a href="index.html" class="logo">
      <img src="./img/logo.png" alt="Logo Demos">
      <span>DEMOS</span>
    </a>

    <a href="login.html" class="icone-menu" aria-label="Minha conta">
      <i class="fa-solid fa-circle-user"></i>
    </a>

  </header>

  <main>
    <h1>Contato</h1>

    <p>
      Tem dúvidas, sugestões ou encontrou algum problema no Demos? Fale com
      a equipe responsável pelo projeto por um dos canais abaixo.
    </p>

    <section id="canais">
      <h2>Canais de contato</h2>
      <ul>
        <li>
          <strong>GitHub:</strong>

          <a href="https://github.com/giovanaags1-cmyk/Proj-de-Software---Grupo-4">repositório oficial do projeto</a>
          (para relatar erros ou sugerir melhorias)
        </li>
      </ul>
    </section>

    <section id="formulario">
      <h2>Envie uma mensagem</h2>

      <form action="https://github.com/giovanaags1-cmyk/Proj-de-Software---Grupo-4" method="post">
        <p>
          <label for="nome">Nome</label><br>
          <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
        </p>

        <p>
          <label for="email">E-mail</label><br>
          <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
        </p>

        <p>
          <label for="assunto">Assunto</label><br>
          <select id="assunto" name="assunto">
            <option value="duvida">Dúvida</option>
            <option value="sugestao">Sugestão</option>
            <option value="problema">Relatar um problema</option>
            <option value="dados">Solicitação sobre meus dados pessoais</option>
          </select>
        </p>

        <p>
          <label for="mensagem">Mensagem</label><br>
          <textarea id="mensagem" name="mensagem" rows="6" placeholder="Escreva sua mensagem aqui" required></textarea>
        </p>

        <button type="submit">Enviar mensagem</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Projeto Demos</p>
  </footer>

</body>
</html>
