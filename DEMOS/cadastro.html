<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Criar conta | Demos</title>

    <link rel="stylesheet" href="./css/demos.css">
    <link rel="stylesheet" href="./css/usuario.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

</head>


<body>


<header class="cabecalho">

    <div class="cabecalho-esquerda">

        <a href="index.html" class="icone-menu">
            <i class="fa-solid fa-bookmark"></i>
        </a>

        <a href="index.html" class="icone-menu">
            <i class="fa-solid fa-house"></i>
        </a>

    </div>


    <a href="index.html" class="logo">

        <img
            src="./img/logo.png"
            alt="Logo Demos"
        >

        <span>Demos</span>

    </a>


    <a href="login.html" class="icone-menu">
        <i class="fa-solid fa-circle-user"></i>
    </a>

</header>



<main class="pagina">


    <a
        href="login.html"
        class="voltar"
    >
        ← Voltar para o login
    </a>



    <div class="perfil">


        <div class="avatar">
            +
        </div>


        <div>

            <h1 class="titulo">
                Criar conta
            </h1>

            <p>
                É gratuito. A conta serve para salvar
                candidatos favoritos e comparações.
            </p>

        </div>


    </div>



    <form id="form-cadastro">


        <section class="secao-usuario">


            <h2>
                Dados pessoais
            </h2>


            <p>
                Como você quer aparecer no site.
            </p>



            <div class="form">


                <div class="campo">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Seu nome completo"
                        minlength="2"
                        maxlength="100"
                        required
                    >

                </div>



                <div class="dupla">


                    <div class="campo">

                        <label for="username">
                            Nome de usuário
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="seu.usuario"
                            minlength="3"
                            maxlength="30"
                            pattern="[a-zA-Z0-9._]+"
                            required
                        >

                        <span class="campo__dica">
                            Letras, números, ponto ou _
                            (sem espaços).
                        </span>

                    </div>



                    <div class="campo">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="voce@email.com"
                            required
                        >

                    </div>


                </div>


            </div>


        </section>



        <section class="secao-usuario">


            <h2>
                Senha
            </h2>


            <p>
                Use pelo menos 8 caracteres.
            </p>



            <div class="form">


                <div class="dupla">


                    <div class="campo">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Mín. 8 caracteres"
                            minlength="8"
                            required
                        >

                    </div>



                    <div class="campo">

                        <label for="confirmar_senha">
                            Confirmar senha
                        </label>

                        <input
                            type="password"
                            id="confirmar_senha"
                            name="confirmar_senha"
                            placeholder="Repita a senha"
                            minlength="8"
                            required
                        >

                    </div>


                </div>



                <label class="checagem">

                    <input
                        type="checkbox"
                        required
                    >

                    <span>

                        Li e aceito os Termos de Uso
                        e a Política de Privacidade.

                    </span>

                </label>


            </div>


        </section>



        <div class="acoes">


            <a
                href="login.html"
                class="botao botao--secundario"
            >
                Cancelar
            </a>


            <button
                type="submit"
                class="botao botao--primario"
            >

                Criar conta

            </button>


        </div>


    </form>


</main>


<script src="./js/usuario.js"></script>

</body>

</html>
