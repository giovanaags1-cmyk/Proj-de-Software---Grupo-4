<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Editar perfil | Demos</title>

    <link rel="stylesheet" href="./css/demos.css">
    <link rel="stylesheet" href="./css/usuario.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

</head>


<body>


<header class="cabecalho">

     <div class="cabecalho-esquerda">

        <a href="index.html" class="icone-menu" aria-label="Favoritos">
            <i class="fa-solid fa-bookmark"></i>
        </a>

        <a href="index.html" class="icone-menu" aria-label="Página inicial">
            <i class="fa-solid fa-house"></i>
        </a>

    </div>


    <a href="index.html" class="logo">

        <img
            src="./img/logo.png"
            alt="Logo Demos"
        >

        <span>Demos</span>

    </a>


    <a href="editar-usuario.html" class="icone-menu">

        <i class="fa-solid fa-circle-user"></i>

    </a>

</header>



<main class="pagina">


    <a
        href="index.html"
        class="voltar"
    >
        ← Voltar
    </a>



    <div class="perfil">


        <div
            class="avatar"
            id="avatar-usuario"
        >
            U
        </div>


        <div>

            <h1 class="titulo">
                Editar perfil
            </h1>

            <p>
                Minha conta Demos
            </p>

        </div>


    </div>



    <form id="form-editar">


        <section class="secao-usuario">


            <h2>
                Dados pessoais
            </h2>


            <p>
                Essas informações aparecem na sua conta.
            </p>



            <div class="form">


                <div class="campo">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                    >

                </div>



                <div class="dupla">


                    <div class="campo">

                        <label for="username">
                            Nome de usuário
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            required
                        >

                    </div>



                    <div class="campo">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                        >

                    </div>


                </div>


            </div>


        </section>



        <section class="secao-usuario">


            <h2>
                Alterar senha
            </h2>


            <p>
                A alteração real de senha será conectada
                posteriormente ao sistema de autenticação.
            </p>


        </section>



        <div class="acoes">


            <a
                href="index.html"
                class="botao botao--secundario"
            >
                Cancelar
            </a>


            <button
                type="submit"
                class="botao botao--primario"
            >
                Salvar alterações
            </button>


        </div>


    </form>


</main>


<script src="./js/usuario.js"></script>

</body>

</html>
