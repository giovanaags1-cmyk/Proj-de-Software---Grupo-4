<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Entrar | Demos</title>

    <link rel="stylesheet" href="./css/demos.css">
    <link rel="stylesheet" href="./css/usuario.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

</head>


<body>


<header class="cabecalho">

    <div class="cabecalho-esquerda">

        <a href="index.html" class="icone-menu" aria-label="Favoritos">
            <i class="fa-solid fa-bookmark"></i>
        </a>

        <a href="index.html" class="icone-menu" aria-label="Página inicial">
            <i class="fa-solid fa-house"></i>
        </a>

    </div>


    <a href="index.html" class="logo">

        <img
            src="./img/logo.png"
            alt="Logo Demos"
        >

        <span>Demos</span>

    </a>


    <a href="login.html" class="icone-menu" aria-label="Entrar ou acessar perfil">
        <i class="fa-solid fa-circle-user"></i>
    </a>

</header>



<main class="pagina pagina--estreita">


    <div class="cabecalho-usuario">

        <div class="avatar">

            <i class="fa-solid fa-lock"></i>

        </div>


        <h1 class="titulo">
            Entrar
        </h1>


        <p>
            Acesse sua conta para ver seus favoritos
            e comparações salvas.
        </p>

    </div>



    <form id="form-login">


        <section class="secao-usuario">


            <h2>
                Seus dados de acesso
            </h2>


            <p>
                Use o nome de usuário e a senha
                que você cadastrou.
            </p>



            <div class="form">


                <div class="campo">

                    <label for="username">
                        Nome de usuário
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="seu.usuario"
                        autocomplete="username"
                        minlength="3"
                        required
                    >

                </div>



                <div class="campo">

                    <label for="password">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Sua senha"
                        autocomplete="current-password"
                        minlength="8"
                        required
                    >

                </div>



                <div class="linha">

                    <label class="checagem">

                        <input
                            type="checkbox"
                            name="lembrar"
                        >

                        Manter conectado

                    </label>


                    <a href="#">
                        Esqueci minha senha
                    </a>

                </div>

            </div>


            <button
                type="submit"
                class="botao botao--primario botao--cheio"
            >

                Entrar

            </button>


        </section>


    </form>


    <p class="alternativa">

        Ainda não tem conta?

        <a href="cadastro.html">
            Cadastre-se
        </a>

    </p>


</main>


<script src="./js/usuario.js"></script>

</body>

</html>
